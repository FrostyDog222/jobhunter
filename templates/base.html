:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,textarea,select{background:var(--field);color:var(--fg);border:1px solid var(--edge);
  border-radius:12px;padding:10px 12px;font:inherit;width:100%;
  transition:border-color .12s,box-shadow .12s}
/* A drawn chevron instead of the system one: the system arrow is black and vanishes on a dark
   field. The colour is baked into the image because a data URI cannot see currentColor. */
select{-webkit-appearance:none;appearance:none;background-image:var(--chev);background-repeat:no-repeat;
  background-position:right 12px center;background-size:16px;padding-right:38px}
select option{background:var(--card-solid);color:var(--fg)}
input:focus,textarea:focus,select:focus{border-color:var(--accent);outline:none;
  box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 24%,transparent)}
input[type=checkbox],input[type=radio]{accent-color:var(--accent2)}
/* the browser's own grey "Choose File" button is the one control that ignores everything above */
input[type=file]{padding:6px 8px;cursor:pointer}
input[type=file]::file-selector-button{margin-right:12px;padding:7px 16px;border-radius:99px;
  border:1px solid var(--edge);background:color-mix(in srgb,var(--accent) 16%,transparent);
  color:var(--fg);font:inherit;font-weight:500;cursor:pointer;transition:background .12s}
input[type=file]::file-selector-button:hover{background:color-mix(in srgb,var(--accent) 28%,transparent)}
input::placeholder{color:var(--dim);opacity:.7}
textarea{resize:vertical;min-height:70px}
label, .fieldlabel{display:block;font-size:11.5px;font-weight:600;color:var(--dim);margin:8px 0 5px;
  text-transform:uppercase;letter-spacing:.08em}
.row{display:flex;gap:10px;flex-wrap:wrap} .row>*{flex:1;min-width:150px}
.muted{color:var(--dim);font-size:13px}
a{color:var(--accent)} a:hover{text-decoration:none}
/* The banner at the top of the page. Loud on purpose - everything in it is something that
   silently stops the app doing its job, and none of it announces itself otherwise. */
#alerts{margin:0 0 6px}
#alerts .alert{display:flex;gap:16px;align-items:center;margin:0 0 14px;padding:16px 20px;
  border-radius:18px;border:1px solid color-mix(in srgb,var(--bad) 55%,var(--edge));
  background:linear-gradient(95deg,color-mix(in srgb,var(--bad) 24%,var(--card-solid)),
    color-mix(in srgb,var(--bad) 8%,var(--card-solid)) 70%);
  box-shadow:0 0 44px -16px color-mix(in srgb,var(--bad) 70%,transparent)}
#alerts .alert.warn{border-color:color-mix(in srgb,var(--mid) 55%,var(--edge));
  background:linear-gradient(95deg,color-mix(in srgb,var(--mid) 22%,var(--card-solid)),
    color-mix(in srgb,var(--mid) 7%,var(--card-solid)) 70%);
  box-shadow:0 0 44px -16px color-mix(in srgb,var(--mid) 60%,transparent)}
/* the triangle is drawn, not typed: the text glyph is hidden so the box is the same on every font */
#alerts .alert .ico{flex:0 0 auto;width:44px;height:44px;border-radius:13px;font-size:0;
  display:grid;place-items:center;color:var(--bad);
  border:1px solid color-mix(in srgb,var(--bad) 60%,transparent);
  background:color-mix(in srgb,var(--bad) 14%,transparent)}
#alerts .alert .ico::before{content:"";width:22px;height:22px;background:currentColor;
  -webkit-mask:var(--i-alert) center/contain no-repeat;mask:var(--i-alert) center/contain no-repeat}
#alerts .alert.warn .ico{color:var(--mid);border-color:color-mix(in srgb,var(--mid) 60%,transparent);
  background:color-mix(in srgb,var(--mid) 14%,transparent)}
#alerts .alert .body{flex:1;min-width:0}
#alerts .alert b{display:block;font-size:16px;margin-bottom:3px;
  color:color-mix(in srgb,var(--bad) 82%,var(--fg))}
#alerts .alert.warn b{color:color-mix(in srgb,var(--mid) 85%,var(--fg))}
#alerts .alert .muted{font-size:13px}
#alerts .alert a.act{flex:0 0 auto;display:inline-flex;align-items:center;gap:9px;padding:9px 20px;
  border-radius:99px;border:1px solid var(--edge);color:var(--fg);text-decoration:none;
  font-weight:600;font-size:13.5px;white-space:nowrap;
  background:color-mix(in srgb,var(--accent) 10%,transparent);transition:background .15s,border-color .15s}
#alerts .alert a.act:hover{background:color-mix(in srgb,var(--accent) 22%,transparent);border-color:var(--accent)}
#alerts .alert a.act::after{content:"";width:16px;height:16px;background:currentColor;
  -webkit-mask:var(--i-arrow) center/contain no-repeat;mask:var(--i-arrow) center/contain no-repeat}
/* a space after the brace: brace-then-hash is how a Jinja comment opens */
@media(max-width:640px){ #alerts .alert{flex-wrap:wrap;padding:14px;gap:12px 14px}
  /* a basis the text cannot shrink below, so the button drops to its own line instead of
     squeezing the message into a 100px column beside it */
  #alerts .alert .body{flex:1 1 calc(100% - 64px)}
  #alerts .alert a.act{margin-left:58px}}
.chainrow{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:13px;
  flex-wrap:wrap;          /* on a phone the two buttons drop to their own line instead of
                              pushing the model name off the side of the card */
  border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent)}
.chainrow .mark{width:12px;flex:0 0 auto}
.peek{position:absolute;right:4px;top:50%;transform:translateY(-50%);background:none;border:0;
  padding:2px 6px;font-size:14px;line-height:1;cursor:pointer;opacity:.5;width:auto;color:inherit;
  box-shadow:none}
.peek:hover, .peek.on{opacity:1}
.peek:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-radius:4px}
/* a model name is "nvidia/deepseek-ai/deepseek-v4.1-flash" - longer than a phone is wide, so it
   shortens with an ellipsis rather than deciding how wide the row is */
.chainrow .muted{flex:1 1 90px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chainrow .gap{flex:1 1 0;min-width:0}
button.tiny{padding:3px 9px;font-size:12px}
button.ghost.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
button.ghost.danger:hover:not(:disabled){color:var(--bad);border-color:var(--bad)}
.pill{display:inline-block;font-size:11px;padding:2px 9px;border-radius:99px;
  border:1px solid var(--edge);color:var(--dim)}
h2{font-size:15px;margin:22px 0 6px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim)}
/* Appears once you are past a screenful. Bottom-right, clear of the toast in the middle. */
#totop{position:fixed;right:20px;bottom:22px;z-index:60;width:42px;height:42px;border-radius:50%;
  place-items:center;background:var(--card-solid);color:var(--dim);cursor:pointer;
  border:1px solid var(--edge);font-size:17px;line-height:1;padding:0;font-weight:700;
  display:none;box-shadow:0 8px 24px -8px rgba(0,0,0,.6),var(--glow)}
/* display, not a fade. Whether the button is THERE should not depend on a transition having
   run: a page that is not being painted never advances one, and the button then sits at
   opacity 0 for ever with no way to tell that from a bug. */
#totop.on{display:grid}
#totop:hover{color:var(--fg);border-color:var(--accent);filter:none}
/* the space after the brace matters: a brace followed directly by a hash opens a Jinja
   comment, and the whole stylesheet disappears into it */
@media(max-width:640px){ #totop{right:12px;bottom:12px} }
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--card-solid);
  border:1px solid var(--edge);padding:11px 18px;border-radius:12px;display:none;z-index:99;
  max-width:90vw;box-shadow:0 14px 40px -12px rgba(0,0,0,.7),var(--glow)}
@media(max-width:640px){main{padding:14px 12px 60px}header{gap:12px;padding:12px}}
{% block css %}{% endblock %}
/* Chips: a list that looks like a list. The profile has used these for skills, links and
   certifications; the dashboard's two search boxes now use them for job titles, which were a
   comma string in a quarter-width input. Shared here rather than copied into the second page. */
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:4px 0}
.chip{display:inline-flex;align-items:center;gap:6px;max-width:100%;
  background:color-mix(in srgb,var(--accent) 7%,transparent);border:1px solid var(--edge);
  border-radius:99px;padding:7px 8px 7px 15px;font-size:13.5px;line-height:1.3}
.chip span{overflow-wrap:anywhere}
.chip button{background:none;border:0;color:var(--dim);cursor:pointer;font-size:15px;padding:0 5px;
  border-radius:99px;line-height:1;box-shadow:none;font-weight:400}
.chip button:hover{color:var(--bad);background:color-mix(in srgb,var(--bad) 16%,transparent);filter:none;box-shadow:none}
.chipin{border:1px dashed var(--edge);border-radius:99px;padding:7px 15px;font-size:13.5px;
  width:auto;min-width:160px;flex:1 1 160px;background:transparent}
.chipin:focus{border-style:solid;border-color:var(--accent);outline:none}
/* The chips sit in a wrapper of their own so the list can be capped at a few rows without taking
   the add-input and the toggle with it - a list built up over a few sessions runs to thirty terms
   and pushed the filters and the results off the screen. The cap is set in JS, from the measured
   height of a real row, so it survives a font change. */
.chipwrap{display:flex;flex-wrap:wrap;gap:6px;align-items:center;width:100%;overflow:hidden}
.chipmore{background:none;border:0;color:var(--accent);cursor:pointer;font-size:12.5px;
  padding:4px 2px;text-decoration:underline;width:auto;flex:0 0 auto;box-shadow:none;font-weight:400}
.chipmore:hover{text-decoration:none;box-shadow:none;filter:none}
</style></head><body>
<div id="bar"><i></i></div>
<header>
  <a class="brand" href="/" aria-label="jobhunter">
    <img class="darkonly" src="/static/logo-wordmark.png" alt="jobhunter" width="690" height="143">
    <img class="lightonly" src="/static/logo-wordmark-light.png" alt="jobhunter" width="690" height="143">
  </a>
  <nav>
    <a href="/profile" class="{{ 'on' if page=='profile' }}"
       {% if page=='profile' %}aria-current="page"{% endif %}>Profile</a>
    <a href="/" class="{{ 'on' if page=='dash' }}"
       {% if page=='dash' %}aria-current="page"{% endif %}>Dashboard</a>
    <a href="/health" class="{{ 'on' if page=='health' }}"
       {% if page=='health' %}aria-current="page"{% endif %}>Health</a>
  </nav>
</header>
<dialog id="askdlg" aria-labelledby="asktitle"></dialog>
<div id="pausebanner" role="status" hidden></div>
<div id="updbanner" role="status" hidden></div>
<main class="{{ 'wide' if page in ('dash', 'profile', 'health') }}">{% block body %}{% endblock %}</main>
<footer style="text-align:center;padding:0 16px 30px;margin-top:-50px">
  <span class="muted">jobhunter — built by
    <a href="https://github.com/FrostyDog222" target="_blank" rel="noopener">FrostyDog</a>.
    Everything it knows stays in this folder.</span>
</footer>
<div id="toast" role="status" aria-live="polite" aria-atomic="true"></div>
<button id="totop" class="ghost" title="Back to top" aria-label="Back to top" hidden>&#8593;</button>
<script>
const $ = s => document.querySelector(s);

// The same dictionary the server used, for the half of the page this file writes itself.
// Empty in English, so every call below is a no-op and the English page is untouched.
const T = {{ T | default({}, true) | tojson }};
const t = s => T[String(s)] ?? s;
// Translate the sentence, THEN drop the live values in. The other order leaves a half-English
// line, and it is the only way a translation can put a value somewhere else in the sentence.
// t() alone cannot help a string with a number in it, which is most of what this app says.
const fill = (key, vars) => Object.entries(vars || {})
  .reduce((out, [k, v]) => out.split('{' + k + '}').join(v), t(key));

// Walk what was just rendered and swap whole text nodes and the three attributes a person
// reads. Exact matches only: text this dictionary has never heard of is left alone, which is
// why an untranslated string shows as English rather than as a gap.
function localiseDOM(root){
  if(!Object.keys(T).length) return;
  const walk = document.createTreeWalker(root || document.body, NodeFilter.SHOW_TEXT, {
    acceptNode: n => n.parentElement && /^(SCRIPT|STYLE|TEXTAREA)$/.test(n.parentElement.tagName)
      ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT});
  const hits = [];
  for(let n = walk.nextNode(); n; n = walk.nextNode()){
    const key = n.nodeValue.trim();
    if(key && T[key]) hits.push([n, n.nodeValue.replace(key, T[key])]);
  }
  for(const [n, v] of hits) n.nodeValue = v;
  for(const el of (root || document.body).querySelectorAll('[title],[placeholder],[aria-label]'))
    for(const a of ['title', 'placeholder', 'aria-label']){
      const v = el.getAttribute(a);
      if(v && T[v.trim()]) el.setAttribute(a, T[v.trim()]);
    }
}

// Every time printed anywhere in the app comes through here, so the switch in Settings is one
// variable rather than a hunt through the templates. 24-hour is the default because that is how
// the time is written here; en-US is only borrowed for its am/pm, not for its date order.
let CLOCK = '24';
const hhmm = d => d.toLocaleTimeString(CLOCK === '12' ? 'en-US' : 'en-GB',
                                       {hour: '2-digit', minute: '2-digit'});
let _t;
// Show a real percentage while something long is running, or fall back to the sliding bar.
// `pct` null puts it back to indeterminate.
function progress(pct, label){
  const bar = document.getElementById('bar');
  if(pct == null){ bar.classList.remove('known'); bar.style.removeProperty('--pct'); }
  else { bar.classList.add('known'); bar.style.setProperty('--pct', pct + '%'); }
  // every busy button, not just the first one the document happened to hold
  for(const b of document.querySelectorAll('.busylabel')) b.textContent = label || '';
}

// The job list runs to dozens of pages and the search bar is at the very top of all of them.
(() => {
  const b = document.getElementById('totop');
  if(!b) return;
  b.hidden = false;
  const show = () => b.classList.toggle('on', window.scrollY > 400);
  addEventListener('scroll', show, {passive: true});
  b.onclick = () => window.scrollTo({top: 0,
    behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'});
  show();
})();

function toast(m, ms=3200){ const el=$('#toast'); el.textContent=t(m); el.style.display='block';
  clearTimeout(_t); _t=setTimeout(()=>el.style.display='none', ms); }
async function api(url, body, method){
  // The method is honoured whether or not there is a body. It used to be read only inside the
  // body branch, so api(url, undefined, 'DELETE') sent a GET - and the one call that does that,
  // Remove photo, fetched the image instead of deleting it and reported an internal error.
  const opts = body === undefined ? {method: method || 'GET'}
             : {method: method || 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(body)};
  return unwrap(await fetch(url, opts));
}
async function unwrap(r){
  const body = await r.text();
  let j; try { j = JSON.parse(body); } catch(e) {
    throw new Error(r.ok ? 'server sent a non-JSON reply' : (body.match(/\w[\w .:'-]{10,200}/)||[r.statusText])[0]);
  }
  if(!r.ok) throw new Error(typeof j.detail === 'string' ? j.detail : JSON.stringify(j.detail||j));
  return j;
}
// What went wrong, in words someone who did not write the app can act on. The raw text still
// goes to the console for whoever is debugging.
const FRIENDLY = [
  [/getaddrinfo|ConnectError|ConnectTimeout|ReadTimeout|timed out|Failed to fetch|NetworkError/i,
   'Could not reach the website or the app. Check your internet connection, and that the black run.bat window is still open.'],
  [/rate limit|out of quota|QuotaError|\b429\b/i,
   'The AI model has used up its free quota for now. Wait a few minutes, or add another provider key under Settings.'],
  [/\b40[13]\b|invalid.{0,20}key|authentication|unauthorized/i,
   'The API key was refused. Open Settings and paste it again.'],
  [/non-JSON reply|Internal Server Error/i,
   'The app hit an internal error. Close the black window and double-click run.bat again.'],
  [/Fill in your profile first/i,
   'Fill in your profile first: open the Profile tab and upload your CV.'],
];
// t() on both arms: the replacement text above, and the server's own message when nothing
// matches - which is usually one of the sentences this app raises itself, so it is in the table.
// The untranslated original goes to the console either way, because that is what gets pasted
// into a bug report.
const friendly = m => { const hit = FRIENDLY.find(([re]) => re.test(String(m)));
  if(hit) console.warn('[detail]', m);
  return t(hit ? hit[1] : String(m)); };

let _busy = 0;   // ref-counted: two things running at once must not switch the bar off early
async function busy(btn, fn, label){
  const old = btn.innerHTML; btn.disabled = true;
  // class, not id: two buttons working at once used to put two id="busylabel" elements in the
  // page, and getElementById only ever found the first, so the second button's count never moved
  btn.innerHTML = '<span class="spin"></span>' + t(label || 'working...')
                + '<span class="busylabel" style="margin-left:6px;opacity:.85"></span>';
  if(++_busy === 1) document.getElementById('bar').classList.add('on');
  try { return await fn(); } catch(e){ toast('⚠ ' + friendly(e.message), 8000); }
  finally {
    btn.disabled = false; btn.innerHTML = old;
    if(--_busy === 0){ const bar = document.getElementById('bar');
      bar.classList.remove('on'); progress(null); }
  }
}

// ---- a new version is ready (only when automatic updates are on) ----
// It asks; it never restarts anything by itself. "Later" lasts until the app is closed and opened again.
async function installUpdateNow(){
  let r;
  try { r = await api('/api/update/apply', {}); }
  catch(e){ toast(e.message || String(e), 8000); return false; }
  if(!r.restart){ toast('Updated. Close the app and start it again with run.bat.', 9000); return true; }
  const v = document.createElement('div'); v.id = 'updveil';
  v.innerHTML = '<div><span class="spin" style="width:26px;height:26px;border-width:3px"></span><b>' + esc(t('Installing and restarting...'))
              + '</b><span class="muted">' + esc(t('This page reloads by itself when the new version is up.')) + '</span></div>';
  document.body.appendChild(v);
  await new Promise(r => setTimeout(r, 2500));          // the old server leaves, the new one arrives
  for(let i = 0; i < 60; i++){
    try { const x = await fetch('/api/update', {cache: 'no-store'}); if(x.ok){ location.reload(); return true; } } catch(_){}
    await new Promise(r => setTimeout(r, 1000));
  }
  v.remove(); toast('The app has not come back. Start it again with run.bat.', 9000);
  return true;
}
async function drawUpdBanner(){
  const box = document.getElementById('updbanner'); if(!box) return;
  let u; try { u = await api('/api/update', undefined, 'GET'); } catch(_){ return; }
  if(!u.auto || u.checkout || u.later || !u.count){ box.hidden = true; return; }
  box.innerHTML = '<div class="tx"><b>' + esc(t('A new version is ready')) + '</b><span>'
    + esc(u.busy ? t('A search is running. Update when it has finished.')
                 : fill('{n} file(s) changed. Updating restarts the app and takes a few seconds.', {n: u.count}))
    + '</span></div><button class="ghost" id="updlater">' + esc(t('Update later')) + '</button>'
    + '<button id="updnow"' + (u.busy ? ' disabled' : '') + '>' + esc(t('Update now')) + '</button>';
  box.hidden = false;
  document.getElementById('updnow').onclick = e => busy(e.target, installUpdateNow, 'updating...');
  document.getElementById('updlater').onclick = async () => {
    try { await api('/api/update/later', {}); } catch(_){}
    box.hidden = true; toast('Reminder kept. It comes back the next time the app is opened.'); };
}
// An in-app question in place of the browser's confirm(): it matches the page, it cannot be switched off by
// the browser, Cancel is what has focus, and an answer that is hard to undo can make the yes wait a moment.
function askConfirm({title, lines, warn, yes, danger, wait}){
  return new Promise(resolve => {
    const d = document.getElementById('askdlg');
    d.innerHTML = '<div class="ask"><h2 id="asktitle">' + esc(title) + '</h2>'
      + (lines || []).map(l => '<p>' + esc(l) + '</p>').join('')
      + (warn ? '<p class="warn">' + esc(warn) + '</p>' : '')
      + '<div class="btns"><button class="ghost" id="askno">' + esc(t('Cancel')) + '</button>'
      + '<button id="askyes" class="' + (danger ? 'danger' : '') + '" disabled>' + esc(yes) + '</button></div></div>';
    const yesB = document.getElementById('askyes'), noB = document.getElementById('askno');
    let left = wait || 0, timer = null;
    const label = yes;
    const tick = () => {
      if(left > 0){ yesB.textContent = label + ' (' + left + ')'; left--; timer = setTimeout(tick, 1000); }
      else { yesB.textContent = label; yesB.disabled = false; }
    };
    tick();
    let done = false;
    const finish = v => { if(done) return; done = true; clearTimeout(timer); d.close(); resolve(v); };
    yesB.onclick = () => finish(true);
    noB.onclick = () => finish(false);
    d.onclose = () => finish(false);                    // Escape
    d.onclick = e => { if(e.target === d) finish(false); };   // the dimmed backdrop
    d.showModal(); noB.focus();
  });
}
// Paused is the one state that is easy to forget and costly if forgotten, so it sits at the top of every page.
async function drawPauseBanner(){
  const box = document.getElementById('pausebanner'); if(!box) return;
  let a; try { a = await api('/api/automation', undefined, 'GET'); } catch(_){ return; }
  if(!a.paused){ box.hidden = true; return; }
  box.innerHTML = '<div class="tx"><b>' + esc(t('Automation is paused')) + '</b><span>'
    + esc(t('Nothing is searching or keeping you signed in until you resume. A job site may log you out in the meantime.'))
    + '</span></div><button id="pauseresume">' + esc(t('Resume')) + '</button>';
  box.hidden = false;
  document.getElementById('pauseresume').onclick = e => busy(e.target, async () => {
    try { await api('/api/automation/resume', {}); toast('Resumed. It runs again at its usual time.'); }
    catch(err){ toast(err.message || String(err), 8000); }
    drawPauseBanner(); if(typeof loadAutoCtl === 'function') loadAutoCtl();
  }, 'working...');
}
drawUpdBanner(); drawPauseBanner(); setInterval(drawUpdBanner, 60000); setInterval(drawPauseBanner, 60000);
{% block js %}{% endblock %}
</script></body></html>
