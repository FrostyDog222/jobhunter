<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}jobhunter{% endblock %}</title>
<link rel="icon" href="/static/logo.webp">
<style>
:root{
  --bg:#0f1115; --card:#181b22; --line:#272b35; --fg:#e7e9ee; --dim:#9aa1af;
  --accent:#6ea8fe; --good:#4ade80; --mid:#fbbf24; --bad:#f87171;
}
@media (prefers-color-scheme:light){:root:not([data-theme=dark]){
  --bg:#f6f7f9; --card:#fff; --line:#e3e6ec; --fg:#14161a; --dim:#5f6775;
  --accent:#2563eb; --good:#16a34a; --mid:#b45309; --bad:#dc2626;}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,Segoe UI,sans-serif}
header{display:flex;gap:18px;align-items:center;padding:13px 20px;border-bottom:1px solid var(--line);
  position:sticky;top:0;background:var(--bg);z-index:10}
header nav{display:flex;gap:18px;align-items:stretch;align-self:stretch}
header nav a{display:flex;align-items:center;padding:0 2px;font-size:14.5px;position:relative}
/* an underline on the page you are on. Colour alone said "current" only to someone who could
   see the difference between two greys, and told nobody which page they had landed on. */
header nav a.on::after{content:"";position:absolute;left:0;right:0;bottom:-14px;height:2px;
  border-radius:2px;background:var(--accent)}
header nav a.on{color:var(--fg);font-weight:600}
header b{font-size:16px} header a{color:var(--dim);text-decoration:none}
header a.on,header a:hover{color:var(--fg)}
/* The wordmark IS the name, so there is no text beside it. Two files: the artwork's "job"
   half is white, which would be invisible on a light page, so the light variant carries that
   half in near-black and leaves the blue alone - blue reads on white perfectly well. */
header .brand{display:flex;align-items:center;flex:0 0 auto;margin-right:4px}
header .brand img{height:24px;width:auto;display:block}
header .brand .lightonly{display:none}
@media (prefers-color-scheme:light){
  :root:not([data-theme=dark]) header .brand .darkonly{display:none}
  :root:not([data-theme=dark]) header .brand .lightonly{display:block}}
:root[data-theme=light] header .brand .darkonly{display:none}
:root[data-theme=light] header .brand .lightonly{display:block}
@media(max-width:520px){header .brand img{height:20px}}
.hero{display:flex;align-items:center;gap:18px;margin:4px 0 14px}
.hero img{width:96px;height:96px;border-radius:14px;object-fit:cover;flex:0 0 auto;
  border:1px solid var(--line)}
.hero h1{font-size:20px;margin:0 0 3px;font-weight:650}
.hero p{margin:0;max-width:52ch}
@media(max-width:520px){.hero img{width:68px;height:68px}}
main{max-width:1060px;margin:0 auto;padding:20px 16px 80px}
.card{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:16px;margin:12px 0}
button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:9px 16px;
  font:inherit;font-weight:500;cursor:pointer;transition:filter .12s,background .12s}
button:hover:not(:disabled){filter:brightness(1.08)}
button:active:not(:disabled){filter:brightness(.94)}
button.ghost{background:transparent;color:var(--dim);border:1px solid var(--line);font-weight:400}
button.ghost:hover:not(:disabled){color:var(--fg);border-color:var(--dim);filter:none}
button:disabled{opacity:.45;cursor:not-allowed}
/* a search takes minutes, so say so twice: a spinner in the button you pressed, and a bar at the
   top of the window for when that button has scrolled out of sight */
@keyframes spin{to{transform:rotate(360deg)}}
.spin{display:inline-block;width:11px;height:11px;margin-right:7px;vertical-align:-1px;
  border:2px solid currentColor;border-right-color:transparent;border-radius:50%;
  animation:spin .7s linear infinite}
button:disabled .spin{opacity:.9}
@keyframes slide{from{left:-45%}to{left:100%}}
#bar{position:fixed;top:0;left:0;right:0;height:3px;z-index:50;display:none;overflow:hidden;
  background:color-mix(in srgb,var(--accent) 14%,transparent)}
#bar.on{display:block}
#bar i{position:absolute;top:0;height:100%;width:45%;background:var(--accent);
  animation:slide 1.15s ease-in-out infinite}
/* once the server can say how far along it is, the bar stops sliding and fills instead */
#bar.known i{animation:none;left:0;width:var(--pct,0%);transition:width .4s ease}
@media(prefers-reduced-motion:reduce){
  .spin,#bar i{animation-duration:0s}
  #bar i{width:100%;opacity:.5}
}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,textarea,select{background:var(--bg);color:var(--fg);border:1px solid var(--line);
  border-radius:8px;padding:9px 10px;font:inherit;width:100%;transition:border-color .12s}
input:focus,textarea:focus,select:focus{border-color:var(--accent);outline:none}
input::placeholder{color:var(--dim);opacity:.7}
textarea{resize:vertical;min-height:70px}
label{display:block;font-size:12px;color:var(--dim);margin:8px 0 3px;text-transform:uppercase;letter-spacing:.04em}
.row{display:flex;gap:10px;flex-wrap:wrap} .row>*{flex:1;min-width:150px}
.muted{color:var(--dim);font-size:13px}
a{color:var(--accent)} a:hover{text-decoration:none}
/* The banner at the top of the page. Loud on purpose - everything in it is something that
   silently stops the app doing its job, and none of it announces itself otherwise. */
#alerts{margin:0 0 4px}
#alerts .alert{display:flex;gap:10px;align-items:flex-start;margin:8px 0;padding:11px 13px;
  border-radius:9px;border:1px solid color-mix(in srgb,var(--bad) 45%,var(--line));
  background:color-mix(in srgb,var(--bad) 9%,transparent)}
#alerts .alert.warn{border-color:color-mix(in srgb,var(--mid) 45%,var(--line));
  background:color-mix(in srgb,var(--mid) 9%,transparent)}
#alerts .alert .ico{font-size:15px;line-height:1.35;flex:0 0 auto;color:var(--bad)}
#alerts .alert.warn .ico{color:var(--mid)}
#alerts .alert .body{flex:1;min-width:0}
#alerts .alert b{display:block;font-size:14px;margin-bottom:2px}
#alerts .alert .muted{font-size:12.8px}
#alerts .alert a.act{white-space:nowrap;font-weight:600;font-size:13px;align-self:center}
.chainrow{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:13px;
  border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent)}
.chainrow .mark{width:12px;flex:0 0 auto}
.chainrow .gap{flex:1}
button.tiny{padding:3px 9px;font-size:12px}
button.ghost.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
button.ghost.danger:hover:not(:disabled){color:var(--bad);border-color:var(--bad)}
.pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--dim)}
h2{font-size:15px;margin:22px 0 6px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim)}
/* Appears once you are past a screenful. Bottom-right, clear of the toast in the middle. */
#totop{position:fixed;right:20px;bottom:22px;z-index:60;width:40px;height:40px;border-radius:50%;
  place-items:center;background:var(--card);color:var(--dim);cursor:pointer;
  border:1px solid var(--line);font-size:17px;line-height:1;padding:0;font-weight:700;
  display:none;box-shadow:0 2px 10px rgba(0,0,0,.28)}
/* display, not a fade. Whether the button is THERE should not depend on a transition having
   run: a page that is not being painted never advances one, and the button then sits at
   opacity 0 for ever with no way to tell that from a bug. */
#totop.on{display:grid}
#totop:hover{color:var(--fg);border-color:var(--dim);filter:none}
/* the space after the brace matters: a brace followed directly by a hash opens a Jinja
   comment, and the whole stylesheet disappears into it */
@media(max-width:640px){ #totop{right:12px;bottom:12px} }
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--card);
  border:1px solid var(--line);padding:10px 16px;border-radius:8px;display:none;z-index:99;max-width:90vw}
@media(max-width:640px){main{padding:14px 12px 60px}header{gap:12px;padding:12px}}
{% block css %}{% endblock %}
</style></head><body>
<div id="bar"><i></i></div>
<header>
  <a class="brand" href="/" aria-label="jobhunter">
    <img class="darkonly" src="/static/logo-wordmark.png" alt="jobhunter" width="690" height="143">
    <img class="lightonly" src="/static/logo-wordmark-light.png" alt="jobhunter" width="690" height="143">
  </a>
  <nav>
    <a href="/profile" class="{{ 'on' if page=='profile' }}"
       {% if page=='profile' %}aria-current="page"{% endif %}>Profile</a>
    <a href="/" class="{{ 'on' if page=='dash' }}"
       {% if page=='dash' %}aria-current="page"{% endif %}>Dashboard</a>
  </nav>
</header>
<main>{% block body %}{% endblock %}</main>
<footer style="text-align:center;padding:0 16px 30px;margin-top:-50px">
  <span class="muted">jobhunter — built by
    <a href="https://github.com/FrostyDog222" target="_blank" rel="noopener">FrostyDog</a>.
    Everything it knows stays in this folder.</span>
</footer>
<div id="toast"></div>
<button id="totop" class="ghost" title="Back to top" aria-label="Back to top" hidden>&#8593;</button>
<script>
const $ = s => document.querySelector(s);

// The same dictionary the server used, for the half of the page this file writes itself.
// Empty in English, so every call below is a no-op and the English page is untouched.
const T = {{ T | default({}, true) | tojson }};
const t = s => T[String(s)] ?? s;

// Walk what was just rendered and swap whole text nodes and the three attributes a person
// reads. Exact matches only: text this dictionary has never heard of is left alone, which is
// why an untranslated string shows as English rather than as a gap.
function localiseDOM(root){
  if(!Object.keys(T).length) return;
  const walk = document.createTreeWalker(root || document.body, NodeFilter.SHOW_TEXT, {
    acceptNode: n => n.parentElement && /^(SCRIPT|STYLE|TEXTAREA)$/.test(n.parentElement.tagName)
      ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT});
  const hits = [];
  for(let n = walk.nextNode(); n; n = walk.nextNode()){
    const key = n.nodeValue.trim();
    if(key && T[key]) hits.push([n, n.nodeValue.replace(key, T[key])]);
  }
  for(const [n, v] of hits) n.nodeValue = v;
  for(const el of (root || document.body).querySelectorAll('[title],[placeholder],[aria-label]'))
    for(const a of ['title', 'placeholder', 'aria-label']){
      const v = el.getAttribute(a);
      if(v && T[v.trim()]) el.setAttribute(a, T[v.trim()]);
    }
}

// Every time printed anywhere in the app comes through here, so the switch in Settings is one
// variable rather than a hunt through the templates. 24-hour is the default because that is how
// the time is written here; en-US is only borrowed for its am/pm, not for its date order.
let CLOCK = '24';
const hhmm = d => d.toLocaleTimeString(CLOCK === '12' ? 'en-US' : 'en-GB',
                                       {hour: '2-digit', minute: '2-digit'});
let _t;
// Show a real percentage while something long is running, or fall back to the sliding bar.
// `pct` null puts it back to indeterminate.
function progress(pct, label){
  const bar = document.getElementById('bar');
  if(pct == null){ bar.classList.remove('known'); bar.style.removeProperty('--pct'); }
  else { bar.classList.add('known'); bar.style.setProperty('--pct', pct + '%'); }
  const b = document.getElementById('busylabel');
  if(b) b.textContent = label || '';
}

// The job list runs to dozens of pages and the search bar is at the very top of all of them.
(() => {
  const b = document.getElementById('totop');
  if(!b) return;
  b.hidden = false;
  const show = () => b.classList.toggle('on', window.scrollY > 400);
  addEventListener('scroll', show, {passive: true});
  b.onclick = () => window.scrollTo({top: 0,
    behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'});
  show();
})();

function toast(m, ms=3200){ const el=$('#toast'); el.textContent=t(m); el.style.display='block';
  clearTimeout(_t); _t=setTimeout(()=>el.style.display='none', ms); }
async function api(url, body, method){
  const r = await fetch(url, body===undefined ? {} : {
    method: method||'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
  return unwrap(r);
}
async function unwrap(r){
  const body = await r.text();
  let j; try { j = JSON.parse(body); } catch(e) {
    throw new Error(r.ok ? 'server sent a non-JSON reply' : (body.match(/\w[\w .:'-]{10,200}/)||[r.statusText])[0]);
  }
  if(!r.ok) throw new Error(typeof j.detail === 'string' ? j.detail : JSON.stringify(j.detail||j));
  return j;
}
// What went wrong, in words someone who did not write the app can act on. The raw text still
// goes to the console for whoever is debugging.
const FRIENDLY = [
  [/getaddrinfo|ConnectError|ConnectTimeout|ReadTimeout|timed out|Failed to fetch|NetworkError/i,
   'Could not reach the website or the app. Check your internet connection, and that the black run.bat window is still open.'],
  [/rate limit|out of quota|QuotaError|\b429\b/i,
   'The AI model has used up its free quota for now. Wait a few minutes, or add another provider key under Settings.'],
  [/\b40[13]\b|invalid.{0,20}key|authentication|unauthorized/i,
   'The API key was refused. Open Settings and paste it again.'],
  [/non-JSON reply|Internal Server Error/i,
   'The app hit an internal error. Close the black window and double-click run.bat again.'],
  [/Fill in your profile first/i,
   'Fill in your profile first: open the Profile tab and upload your CV.'],
];
const friendly = m => { const hit = FRIENDLY.find(([re]) => re.test(String(m)));
  if(hit) console.warn('[detail]', m);
  return hit ? hit[1] : m; };

let _busy = 0;   // ref-counted: two things running at once must not switch the bar off early
async function busy(btn, fn, label){
  const old = btn.innerHTML; btn.disabled = true;
  btn.innerHTML = '<span class="spin"></span>' + (label || 'working...')
                + '<span id="busylabel" style="margin-left:6px;opacity:.85"></span>';
  if(++_busy === 1) document.getElementById('bar').classList.add('on');
  try { return await fn(); } catch(e){ toast('⚠ ' + friendly(e.message), 8000); }
  finally {
    btn.disabled = false; btn.innerHTML = old;
    if(--_busy === 0){ const bar = document.getElementById('bar');
      bar.classList.remove('on'); progress(null); }
  }
}
{% block js %}{% endblock %}
</script></body></html>
